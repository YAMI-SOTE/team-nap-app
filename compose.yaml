services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      # `development` keeps dev-only helpers on (password-reset token in the
      # response, GET /auth/debug). Set to `production` for a real deploy.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://teamnap:teamnap_dev@db:5432/teamnap
      OLLAMA_URL: http://ollama:11434
      # gemma3n:e2b needs ~8GB/2CPU for the ollama container. On a smaller
      # host set OLLAMA_MODEL=gemma3:1b (weaker JP) — everything still
      # falls back to rule-based copy if the model can't run. See
      # docs/ai-development.md.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3n:e2b}

    ports:
      - "3000:3000"

    # The API only needs Postgres to start. Ollama (and the model pull) come
    # up on their own schedule — a slow or failing pull must not keep the
    # API down. AI endpoints degrade until Ollama is ready.
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        - CMD-SHELL
        - ollama list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest

    restart: "no"

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3n:e2b}

    volumes:
      - ollama_data:/root/.ollama

    entrypoint:
      - /bin/sh
      - -c
      - until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$${OLLAMA_MODEL}"

    depends_on:
      ollama:
        condition: service_healthy

  db:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: teamnap
      POSTGRES_USER: teamnap
      POSTGRES_PASSWORD: teamnap_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamnap -d teamnap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ollama_data:
